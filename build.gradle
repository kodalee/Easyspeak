plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

group = 'com.github.kodalee'
version = '1.0'

repositories {
    mavenCentral()

    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }

    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly('me.clip:placeholderapi:2.12.2')

    // ✅ DATABASE (required at runtime)
    implementation "com.zaxxer:HikariCP:5.1.0"
    implementation "org.mariadb.jdbc:mariadb-java-client:3.4.1"
    implementation "com.h2database:h2:2.2.224"
}

tasks {
    runServer {
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion

    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'

    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    // ✅ This is IMPORTANT: bundles DB drivers into your plugin jar
    relocate "com.zaxxer.hikari", "com.github.kodalee.libs.hikari"
    relocate "org.mariadb", "com.github.kodalee.libs.mariadb"
    relocate "org.h2", "com.github.kodalee.libs.h2"
}

build {
    dependsOn shadowJar
}